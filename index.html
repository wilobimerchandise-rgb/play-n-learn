<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play N Learn - Wilo 🦉</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXGDB7DE10"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXGDB7DE10');
  </script>

  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(180deg, #4A148C 0%, #880E4F 100%);
      color: white;
      text-align: center;
      padding: 20px;
      min-height: 100vh;
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .coins { background: #FFC107; color: black; padding: 8px 15px; border-radius: 20px; font-weight: bold; }
    h1 {
      background: linear-gradient(90deg, #FFEB3B, #E91E63, #2196F3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2em;
      margin: 10px 0;
    }
    .owl { font-size: 80px; margin: 10px 0; }
    .quote { color: #80D8FF; font-size: 1.1em; margin: 10px 0; }
    .btn-main {
      background: linear-gradient(90deg, #FFC107, #FF5722);
      color: black; border: none; padding: 18px; width: 90%; max-width: 400px;
      border-radius: 25px; font-size: 20px; font-weight: bold; margin: 20px auto; cursor: pointer;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 400px; margin: 0 auto; }
    .btn {
      border: none; padding: 20px; border-radius: 15px; color: white;
      font-size: 16px; font-weight: bold; cursor: pointer;
    }
    .btn-math { background: #7B1FA2; }
    .btn-science { background: #1976D2; }
    .btn-words { background: #D32F2F; }
    .btn-memory { background: #388E3C; }
    #gameArea { margin-top: 30px; padding: 20px; background: rgba(255,255,255,0.1); border-radius: 15px; }
    .question { font-size: 24px; margin: 20px 0; }
    .answer-btn { background: white; color: black; margin: 5px; padding: 15px; border-radius: 10px; border: none; width: 80px; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Play N Learn</h2>
    <div class="coins">💰 <span id="coins">240</span></div>
  </div>

  <h1>Hi There, Superstar!</h1>
  <div class="owl">🦉</div>
  <p class="quote">"Wilo: Let's train your brain!"</p>
  <p>Math, Science, Words & Memory!</p>

  <button class="btn-main" onclick="startGame('Arcade')">🎮 Enter Arcade 🎮</button>

  <div class="grid">
    <button class="btn btn-math" onclick="startGame('Math')">🎈 Math</button>
    <button class="btn btn-science" onclick="startGame('Science')">✏️ Science</button>
    <button class="btn btn-words" onclick="startGame('Words')">abc Words</button>
    <button class="btn btn-memory" onclick="startGame('Memory')">🧠 Memory</button>
  </div>

  <div id="gameArea"></div>

  <script>
    let coins = 240;
    
    function startGame(gameName) {
      gtag('event','play_game',{game_name: gameName});
      
      if(gameName === 'Math') {
        startMathGame();
      } else {
        document.getElementById('gameArea').innerHTML = `<h2>${gameName} Game</h2><p>Coming Soon! Wilo is building this 🚧</p>`;
      }
    }

    function startMathGame() {
      let num1 = Math.floor(Math.random() * 10) + 1;
      let num2 = Math.floor(Math.random() * 10) + 1;
      let answer = num1 + num2;
      
      document.getElementById('gameArea').innerHTML = `
        <h2>🧮 Math Game</h2>
        <div class="question">What is ${num1} + ${num2}?</div>
        <button class="answer-btn" onclick="checkAnswer(${answer}, ${answer})">${answer}</button>
        <button class="answer-btn" onclick="checkAnswer(${answer}, ${answer+1})">${answer+1}</button>
        <button class="answer-btn" onclick="checkAnswer(${answer}, ${answer-1})">${answer-1}</button>
      `;
    }

    function checkAnswer(correct, picked) {
      if(correct === picked) {
        coins += 10;
        document.getElementById('coins').innerText = coins;
        alert('Correct! +10 Coins 🎉');
        startMathGame();
      } else {
        alert('Try Again! 💪');
      }
    }
  </script>
</body>
  </html>
